name: Twitter/X Monitor

on:
  schedule:
    # 每30分钟运行一次 (UTC时间)
    # 公开仓库无限制；私有仓库建议改为每小时 '0 * * * *' 以节省额度
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SCREEN_NAME: ${{ vars.SCREEN_NAME || 'aleabitoreddit' }}
        run: python x_monitor.py

      - name: Commit state changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          git diff --staged --quiet || (git commit -m "[bot] Update monitor state $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
